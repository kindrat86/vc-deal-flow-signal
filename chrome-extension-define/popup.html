<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VC Term Highlighter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hdr">
    <h1>VC Term Highlighter</h1>
    <span class="tag">v0.1</span>
  </header>

  <p class="lede">
    Underlines VC terms on any page. Click any underlined term to read the
    full definition on GitDealFlow.
  </p>

  <div class="row">
    <label class="toggle">
      <input id="toggle" type="checkbox" checked />
      <span class="track" aria-hidden="true"></span>
      <span class="label">Highlight terms on this site</span>
    </label>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="stat-value" id="count">—</span>
      <span class="stat-label">terms found on this page</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="total">—</span>
      <span class="stat-label">terms in glossary</span>
    </div>
  </div>

  <nav class="links">
    <a class="primary" id="link-glossary"
       href="https://signals.gitdealflow.com/glossary?utm_source=extension&amp;utm_medium=popup&amp;utm_campaign=vc_term_highlighter"
       target="_blank" rel="noopener noreferrer">
      Open the full glossary
    </a>
    <a class="secondary" id="link-tools"
       href="https://signals.gitdealflow.com/tools?utm_source=extension&amp;utm_medium=popup&amp;utm_campaign=vc_term_highlighter"
       target="_blank" rel="noopener noreferrer">
      VC calculators (SAFE, runway, burn…)
    </a>
  </nav>

  <footer class="ft">
    <a href="https://signals.gitdealflow.com?utm_source=extension&amp;utm_medium=popup&amp;utm_campaign=vc_term_highlighter"
       target="_blank" rel="noopener noreferrer">gitdealflow.com</a>
    &middot; <span class="dim">no tracking, no data collected</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
