name: YouTube Perfect VSL — evergreen render

# Brunson Expert Secrets §3 Ch 12 (Perfect Webinar) applied to the VSL form.
# This is the evergreen 10-minute synthetic-voice VSL that lives at /vsl.
# Workflow_dispatch only — re-run when pseo-site/content/vsl-script.json
# changes. Output is unlisted by default; flip to public after review.
#
# Anonymity rule: synthetic voice (Cartesia "Theo") only. No founder face,
# voice, or name. Per memory: synthetic TTS is explicitly allowed
# (feedback_anonymity_no_podcasts.md, updated 2026-05-05).

on:
  workflow_dispatch:
    inputs:
      skip_captions:
        description: "Skip whisper captions (faster, no scrolling text)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: youtube-vsl
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/video
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/video/package-lock.json

      - name: Install system deps (ffmpeg + chromium libs for Remotion)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libxcomposite1 \
            libxdamage1 libxrandr2 libxkbcommon0 libgbm1 libpango-1.0-0 \
            libasound2t64 libgtk-3-0

      - name: Install npm deps
        run: npm ci

      - name: Decode YouTube OAuth credentials
        run: |
          echo "${{ secrets.YT_CREDENTIALS_B64 }}" | base64 -d > .yt-credentials.json
          echo "${{ secrets.YT_TOKEN_B64 }}" | base64 -d > .yt-token.json

      - name: Write Cartesia env
        run: |
          cat > .env.local <<EOF
          CARTESIA_API_KEY=${{ secrets.CARTESIA_API_KEY }}
          CARTESIA_VOICE_ID=${{ secrets.CARTESIA_VOICE_ID }}
          CARTESIA_VOICE_NAME=Theo
          CARTESIA_MODEL_ID=sonic-2
          CARTESIA_VERSION=2026-03-01
          EOF

      - name: Run VSL pipeline
        env:
          SKIP_CAPTIONS: ${{ inputs.skip_captions == true && '1' || '0' }}
        run: bash scripts/run-vsl.sh

      - name: Show next step (manual videoId update)
        run: |
          echo "::notice::VSL render complete. Now update pseo-site/app/vsl/page.tsx VIDEO_ID const with the printed YouTube ID, commit, and redeploy."
