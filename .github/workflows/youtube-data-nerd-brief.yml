name: YouTube weekly Data Nerd Brief

# Brunson Expert Secrets Ch 3 — Charismatic Leader recurring character moment.
# A second weekly Short on a different beat from the Monday data show.
# Wed 14:07 UTC. Pulls one of seven persona frames anchored to the live
# signals API, generates a fresh 60-second video via Cartesia + Remotion,
# uploads to the channel.
#
# Cron only fires from the default branch (main). Until this file is on
# main, use the workflow_dispatch trigger to run it manually.

on:
  schedule:
    - cron: "7 14 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-data-nerd-brief
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools/video
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/video/package-lock.json

      - name: Install system deps (ffmpeg + chromium libs for Remotion)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libxcomposite1 \
            libxdamage1 libxrandr2 libxkbcommon0 libgbm1 libpango-1.0-0 \
            libasound2t64 libgtk-3-0

      - name: Install npm deps
        run: npm ci

      - name: Decode YouTube OAuth credentials
        run: |
          echo "${{ secrets.YT_CREDENTIALS_B64 }}" | base64 -d > .yt-credentials.json
          echo "${{ secrets.YT_TOKEN_B64 }}" | base64 -d > .yt-token.json

      - name: Write Cartesia env
        run: |
          cat > .env.local <<EOF
          CARTESIA_API_KEY=${{ secrets.CARTESIA_API_KEY }}
          CARTESIA_VOICE_ID=${{ secrets.CARTESIA_VOICE_ID }}
          CARTESIA_VOICE_NAME=Theo
          CARTESIA_MODEL_ID=sonic-2
          CARTESIA_VERSION=2026-03-01
          EOF

      - name: Run Brief pipeline
        env:
          SKIP_CAPTIONS: "1"
        run: bash scripts/run-data-nerd-brief.sh

      - name: Commit content archive
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/data-nerd-brief.json content/archive/ || true
          git diff --cached --quiet || \
            git commit -m "youtube: weekly Data Nerd Brief ship $(date -u +%Y-%m-%d)"
          git push || true

      - name: Cleanup secrets
        if: always()
        run: rm -f .yt-credentials.json .yt-token.json .env.local
