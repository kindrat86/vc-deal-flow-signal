name: Deploy pSEO site to Vercel

# RETIRED 2026-07-18 — the weekly Monday cron is disabled. `main` is now the
# single source of truth for pseo and is deployed directly from the canonical
# local checkout (~/Downloads/vc-deal-flow-signal/pseo-site → `vercel deploy
# --prod`, project pseo-site) by the gitdealflow-audit-improve-deploy task.
# This workflow's server-side Monday cron was a REDUNDANT second deployer that
# raced the canonical path and contributed to the team-wide concurrent-build
# jam. The `schedule:` trigger is removed; `workflow_dispatch` is kept only as
# a manual break-glass path (note: it also needs the PAT to carry an `actions`
# scope, which it currently lacks). Do NOT re-add the cron without also
# retiring one of the two deployers — one prod project, one deployer.
# vercel deploy needs --archive=tgz: the site has too many files for the
# default per-file manifest (hits the 10 MB request limit).

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-pseo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pseo-site
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pseo-site/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Pull Vercel project settings + production env
        run: npx vercel pull --yes --environment production --token "$VERCEL_TOKEN"

      - name: Build
        run: npx vercel build --prod --yes --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        run: npx vercel deploy --prebuilt --prod --yes --archive=tgz --token "$VERCEL_TOKEN"

      - name: Verify production freshness
        run: |
          sleep 10
          curl -sf https://signals.gitdealflow.com/api/health.json | tee /tmp/health.json
          python3 - <<'EOF'
          import json, datetime, sys
          h = json.load(open("/tmp/health.json"))
          built = datetime.datetime.fromisoformat(h["buildTime"].replace("Z", "+00:00"))
          age_min = (datetime.datetime.now(datetime.timezone.utc) - built).total_seconds() / 60
          assert age_min < 60, f"buildTime is {age_min:.0f} min old — alias did not update"
          assert h["status"] == "ok", h
          print(f"OK: live build is {age_min:.0f} min old")
          EOF
