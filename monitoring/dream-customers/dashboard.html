<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dream Customers CRM</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0b1220; color:#e2e8f0; }
  header { padding:12px 18px; border-bottom:1px solid #1e293b; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:15px; font-weight:600; color:#f1f5f9; }
  header .meta { font-size:11px; color:#64748b; }
  header .controls { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  header input[type="search"], header select { background:#0b1220; border:1px solid #334155; color:#e2e8f0; padding:5px 8px; border-radius:4px; font-size:12px; }
  header input[type="search"] { min-width:180px; }
  header label.toggle { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:#94a3b8; cursor:pointer; }
  header label.toggle input { margin:0; accent-color:#0ea5e9; }
  header button.refresh { background:#1e293b; color:#cbd5e1; border:1px solid #334155; padding:5px 10px; border-radius:4px; font-size:12px; cursor:pointer; }
  header button.refresh:hover { border-color:#0ea5e9; color:#0ea5e9; }
  .board { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:12px; padding:14px; min-height: calc(100vh - 60px); align-items:flex-start; }
  .col { min-width:0; background:rgba(15,23,42,0.5); border:1px solid #1e293b; border-radius:8px; display:flex; flex-direction:column; }
  .col.drag-over { border-color:#0ea5e9; background:#082f49; }
  .col h2 { margin:0; padding:10px 12px; border-bottom:1px solid #1e293b; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:#cbd5e1; display:flex; justify-content:space-between; align-items:center; }
  .col h2 .count { font-family:ui-monospace,Menlo,monospace; color:#64748b; font-weight:400; }
  .col .cards { padding:8px; display:flex; flex-direction:column; gap:6px; min-height:80px; max-height:calc(100vh - 130px); overflow-y:auto; }
  .col .empty { color:#475569; font-size:11px; text-align:center; padding:18px 0; }
  .card { background:#111a2e; border:1px solid #1e293b; border-radius:6px; padding:8px 10px; font-size:12.5px; cursor:grab; transition:border-color .12s; position:relative; }
  .card:hover { border-color:#334155; }
  .card.dragging { opacity:0.4; }
  .card.fresh { border-left:3px solid #f59e0b; }
  .card.not-dream { opacity:0.55; }
  .card .name { font-weight:600; color:#f1f5f9; }
  .card .handle { color:#0ea5e9; font-size:11px; }
  .card .handle a { color:inherit; text-decoration:none; }
  .card .handle a:hover { text-decoration:underline; }
  .card .firm { color:#94a3b8; font-size:10.5px; margin-top:2px; }
  .card .bottom { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:6px; }
  .card .chips { display:flex; gap:4px; align-items:center; }
  .chip { font-size:9.5px; padding:1px 5px; border-radius:3px; line-height:1.4; }
  .chip.seg-A { background:rgba(99,102,241,0.18); color:#a5b4fc; }
  .chip.seg-B { background:rgba(16,185,129,0.18); color:#6ee7b7; }
  .chip.seg-C { background:rgba(168,85,247,0.18); color:#d8b4fe; }
  .chip.seg-D { background:rgba(245,158,11,0.18); color:#fcd34d; }
  .chip.seg-E { background:rgba(20,184,166,0.18); color:#5eead4; }
  .chip.seg-F { background:rgba(244,63,94,0.18); color:#fda4af; }
  .chip.conf-HIGH { background:rgba(34,197,94,0.12); color:#86efac; border:1px solid rgba(34,197,94,0.4); }
  .chip.conf-MEDIUM { background:transparent; color:#fcd34d; border:1px dashed rgba(245,158,11,0.5); }
  .chip.conf-LOW { background:transparent; color:#64748b; border:1px dotted #475569; }
  .chip.dream { background:rgba(236,72,153,0.16); color:#f9a8d4; }
  .score { display:inline-flex; align-items:center; gap:3px; font-size:11px; font-family:ui-monospace,Menlo,monospace; color:#94a3b8; }
  .score.has { color:#fbbf24; font-weight:600; }
  .card .signal { margin-top:6px; padding-top:6px; border-top:1px solid #1e293b; font-size:10.5px; color:#94a3b8; line-height:1.4; }
  .card .signal .tweet { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; color:#cbd5e1; margin-top:2px; }
  .card .signal .when { color:#f59e0b; font-weight:600; }
  .card .signal .when.cool { color:#64748b; font-weight:400; }
  .drawer-mask { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; z-index:50; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:380px; background:#0b1220; border-left:1px solid #1e293b; padding:16px; overflow-y:auto; z-index:51; display:none; }
  .drawer.open, .drawer-mask.open { display:block; }
  .drawer h3 { margin:0 0 14px; font-size:13px; color:#f1f5f9; display:flex; justify-content:space-between; align-items:center; }
  .drawer label { display:block; margin-bottom:12px; font-size:11px; color:#64748b; text-transform:uppercase; letter-spacing:0.8px; }
  .drawer textarea, .drawer select, .drawer input { width:100%; background:#0b1220; border:1px solid #334155; color:#e2e8f0; padding:6px 8px; border-radius:4px; font-size:13px; font-family:inherit; margin-top:4px; }
  .drawer textarea { min-height:140px; resize:vertical; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; }
  .drawer .row { display:flex; gap:8px; }
  .drawer .row > * { flex:1; }
  .drawer .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; padding-top:12px; border-top:1px solid #1e293b; }
  .drawer .actions button { background:#0ea5e9; color:#0b1220; border:0; padding:6px 12px; border-radius:4px; font-size:12px; font-weight:600; cursor:pointer; }
  .drawer .actions button.secondary { background:#1e293b; color:#cbd5e1; }
  .drawer .score-breakdown { background:#0b1220; border:1px solid #1e293b; border-radius:4px; padding:8px; font-family:ui-monospace,Menlo,monospace; font-size:11px; color:#94a3b8; }
  .drawer .score-breakdown .total { color:#fbbf24; font-weight:600; }
  .toast { position:fixed; bottom:16px; right:16px; background:#1e293b; border:1px solid #334155; padding:8px 12px; border-radius:6px; font-size:12px; z-index:100; opacity:0; transition:opacity .2s; }
  .toast.show { opacity:1; }
  .toast.err { background:#450a0a; border-color:#7f1d1d; color:#fecaca; }
  .splash { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#0b1220; z-index:200; color:#64748b; font-size:13px; }
  .splash.err { color:#fca5a5; }
  .splash a { color:#0ea5e9; }

  /* ---- View toggle ---- */
  .viewtoggle { display:inline-flex; border:1px solid #334155; border-radius:6px; overflow:hidden; }
  .viewtoggle button { background:#0b1220; color:#94a3b8; border:0; padding:5px 11px; font-size:12px; cursor:pointer; }
  .viewtoggle button:hover { color:#e2e8f0; }
  .viewtoggle button.active { background:#0ea5e9; color:#0b1220; font-weight:600; }

  /* ---- Gamified leaderboard ---- */
  #leaderboard { padding:18px; max-width:900px; margin:0 auto; }
  .lb-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
  .lb-stat { background:rgba(15,23,42,0.6); border:1px solid #1e293b; border-radius:10px; padding:13px 12px; text-align:center; }
  .lb-stat .v { font-size:21px; font-weight:700; color:#f1f5f9; font-family:ui-monospace,Menlo,monospace; line-height:1.2; }
  .lb-stat .l { font-size:9.5px; text-transform:uppercase; letter-spacing:0.8px; color:#64748b; margin-top:4px; }

  .podium { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; align-items:end; margin-bottom:24px; }
  .pod { background:linear-gradient(180deg, rgba(30,41,59,0.55), rgba(15,23,42,0.35)); border:1px solid #1e293b; border-radius:12px; padding:14px 10px 16px; text-align:center; cursor:pointer; transition:transform .1s, border-color .12s; }
  .pod[data-id]:hover { border-color:#475569; }
  .pod .medal { font-size:28px; line-height:1; }
  .pod .avatar { width:48px; height:48px; border-radius:50%; margin:8px auto 2px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:19px; color:#0b1220; }
  .pod .pname { font-weight:600; color:#f1f5f9; font-size:13px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pod .phandle { color:#0ea5e9; font-size:11px; }
  .pod .pscore { font-family:ui-monospace,Menlo,monospace; font-weight:700; font-size:18px; margin-top:5px; }
  .pod.rank1 { border-color:#fbbf24; box-shadow:0 0 0 1px rgba(251,191,36,0.35), 0 10px 32px -14px rgba(251,191,36,0.5); transform:translateY(-10px); }
  .pod.rank2 { border-color:#94a3b8; }
  .pod.rank3 { border-color:#b45309; }

  .lb-list { display:flex; flex-direction:column; gap:7px; }
  .lb-row { display:grid; grid-template-columns:30px 34px 1fr auto; align-items:center; gap:12px; background:#111a2e; border:1px solid #1e293b; border-radius:8px; padding:9px 14px; cursor:pointer; transition:border-color .12s, transform .08s; }
  .lb-row:hover { border-color:#334155; transform:translateX(2px); }
  .lb-row .rank { font-family:ui-monospace,Menlo,monospace; font-size:13px; color:#64748b; text-align:center; }
  .lb-row .avatar { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:#0b1220; }
  .lb-row .who .nm { font-weight:600; color:#f1f5f9; font-size:13px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .lb-row .who .hd { color:#0ea5e9; font-size:11px; }
  .lb-row .who .hd a { color:inherit; text-decoration:none; }
  .lb-row .who .hd a:hover { text-decoration:underline; }
  .lb-row .right { display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
  .lb-row .right .topline { display:flex; align-items:center; gap:12px; }
  .pts { font-family:ui-monospace,Menlo,monospace; font-weight:700; font-size:15px; color:#fbbf24; min-width:46px; text-align:right; }
  .pts.zero { color:#475569; }

  .tier { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:600; padding:2px 8px; border-radius:20px; white-space:nowrap; }
  .bd { display:flex; gap:9px; font-size:11px; color:#94a3b8; font-family:ui-monospace,Menlo,monospace; }
  .bd span.z { color:#334155; }
  .badges { display:flex; gap:5px; }
  .badge { font-size:14px; cursor:default; }
  .xp { width:170px; height:5px; background:#1e293b; border-radius:3px; overflow:hidden; }
  .xp > i { display:block; height:100%; border-radius:3px; transition:width .4s; }
  @media (max-width:640px) {
    .lb-stats { grid-template-columns:repeat(2,1fr); }
    .xp { width:90px; }
    .lb-row .right .topline { gap:8px; }
  }
</style>
</head>
<body>

<div id="splash" class="splash">Loading dashboard.config.js…</div>

<header style="display:none" id="hdr">
  <div>
    <h1>Dream Customers CRM</h1>
    <div class="meta" id="meta">—</div>
  </div>
  <div class="controls">
    <div class="viewtoggle">
      <button id="view-lb" class="active">🏆 Leaderboard</button>
      <button id="view-board">📋 Board</button>
    </div>
    <input type="search" id="q" placeholder="search name / handle / firm">
    <span id="lb-controls" style="display:inline-flex; align-items:center; gap:8px;">
      <label class="toggle"><input type="checkbox" id="lb-followers-only" checked> followers only</label>
    </span>
    <span id="board-controls" style="display:none; align-items:center; gap:8px;">
      <select id="seg-filter">
        <option value="">all segments</option>
        <option value="A">A · Solo GPs / micro-VCs</option>
        <option value="B">B · Series A/B GPs</option>
        <option value="C">C · Corp Dev</option>
        <option value="D">D · LP-side</option>
        <option value="E">E · PE operating partners</option>
        <option value="F">F · Misc apex</option>
      </select>
      <label class="toggle"><input type="checkbox" id="dream-only" checked> dream only</label>
    </span>
    <button class="refresh" id="refresh">↻ refresh</button>
  </div>
</header>

<div class="board" id="board" style="display:none"></div>
<div id="leaderboard" style="display:none"></div>

<div class="drawer-mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <h3>Edit contact <button id="close" class="secondary" style="background:#1e293b;color:#94a3b8;border:0;font-size:18px;line-height:1;cursor:pointer;">×</button></h3>
  <div id="drawer-body"></div>
</aside>
<div class="toast" id="toast"></div>

<script src="dashboard.config.js"></script>
<script>
(function () {
  const STAGES = [
    { key: "sourced",   label: "Sourced" },
    { key: "following", label: "Following" },
    { key: "followers", label: "Followers" },
  ];
  const SEGMENT_LABEL = {
    A: "Solo GPs / micro-VCs",
    B: "Series A/B GPs",
    C: "Corp Dev",
    D: "LP-side",
    E: "PE operating partners",
    F: "Misc apex",
  };

  const splash = document.getElementById("splash");
  if (!window.PB_CONFIG || !window.PB_CONFIG.token) {
    splash.className = "splash err";
    splash.innerHTML = "Missing PocketBase token.<br>Run <code>python3 launch.py</code> to refresh.";
    return;
  }

  // When the page is served over http(s) — locally on :8090 OR through the
  // Tailscale proxy (https://…ts.net) — PocketBase's API lives at the SAME
  // origin, so use that. This avoids mixed-content blocking (an https page
  // can't fetch http://127.0.0.1) and the wrong-host problem when opened from
  // another device. Only file:// opens fall back to the configured absolute URL.
  const PB_URL = location.protocol === "file:"
    ? window.PB_CONFIG.url.replace(/\/$/, "")
    : location.origin;
  const TOKEN = window.PB_CONFIG.token;

  // Engagement tiers, highest first. score = sum of weighted inbound events.
  const TIERS = [
    { min: 75, name: "Champion", emoji: "👑", color: "#fbbf24", bg: "rgba(251,191,36,0.16)" },
    { min: 35, name: "Superfan", emoji: "⭐", color: "#c4b5fd", bg: "rgba(168,85,247,0.18)" },
    { min: 15, name: "Fan",      emoji: "🔥", color: "#fcd34d", bg: "rgba(245,158,11,0.16)" },
    { min: 5,  name: "Regular",  emoji: "💬", color: "#7dd3fc", bg: "rgba(14,165,233,0.16)" },
    { min: 1,  name: "Spark",    emoji: "✨", color: "#a5b4fc", bg: "rgba(99,102,241,0.16)" },
    { min: 0,  name: "Lurker",   emoji: "😴", color: "#64748b", bg: "rgba(100,116,139,0.12)" },
  ];

  let CONTACTS = []; // server records (with id)
  let EVENTS_BY_CONTACT = {}; // { contactId: [events] }
  let activeContactId = null;
  let filters = { q: "", segment: "", dreamOnly: true };
  let VIEW = "leaderboard"; // "leaderboard" | "board"
  let lbFollowersOnly = true;

  // ---- API ----
  async function api(path, opts = {}) {
    const res = await fetch(PB_URL + path, {
      method: opts.method || "GET",
      headers: Object.assign(
        { "Authorization": "Bearer " + TOKEN },
        opts.body ? { "Content-Type": "application/json" } : {},
      ),
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    if (!res.ok) {
      const text = await res.text();
      throw new Error("HTTP " + res.status + " " + path + ": " + text.slice(0, 200));
    }
    const ct = res.headers.get("content-type") || "";
    return ct.includes("json") ? res.json() : null;
  }

  async function fetchAllContacts() {
    const data = await api("/api/collections/contacts/records?perPage=500&sort=-last_tweet_at,x_handle");
    return data.items;
  }

  async function fetchAllEvents() {
    // Sum done client-side. For 74 contacts and few events this is fine.
    const data = await api("/api/collections/engagement_events/records?perPage=500&sort=-occurred_at");
    return data.items;
  }

  async function patchContact(id, body) {
    return api("/api/collections/contacts/records/" + id, { method: "PATCH", body });
  }

  // ---- Helpers ----
  function toast(msg, isErr) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "toast show" + (isErr ? " err" : "");
    setTimeout(() => el.classList.remove("show"), isErr ? 4000 : 2200);
  }

  function relTime(iso) {
    if (!iso) return null;
    const ms = Date.now() - new Date(iso).getTime();
    if (isNaN(ms)) return null;
    const m = Math.floor(ms / 60000);
    if (m < 1) return "just now";
    if (m < 60) return m + "m ago";
    const h = Math.floor(m / 60);
    if (h < 24) return h + "h ago";
    const d = Math.floor(h / 24);
    return d + "d ago";
  }
  function isFresh(iso) {
    if (!iso) return false;
    return Date.now() - new Date(iso).getTime() < 12 * 3600 * 1000;
  }

  function scoreOf(contactId) {
    const events = EVENTS_BY_CONTACT[contactId] || [];
    let total = 0;
    for (const e of events) total += (e.score_weight || 0);
    return total;
  }

  function scoreBreakdown(contactId) {
    const events = EVENTS_BY_CONTACT[contactId] || [];
    const byKey = {};
    for (const e of events) {
      const k = e.direction + "/" + e.type;
      byKey[k] = byKey[k] || { count: 0, weight: 0 };
      byKey[k].count++;
      byKey[k].weight += (e.score_weight || 0);
    }
    return { total: scoreOf(contactId), breakdown: byKey };
  }

  function passesFilter(c) {
    if (filters.dreamOnly && !c.dream_customer) return false;
    if (filters.segment && c.segment !== filters.segment) return false;
    if (filters.q) {
      const q = filters.q.toLowerCase();
      const hay = (c.x_handle + " " + (c.display_name || "") + " " + (c.firm || "") + " " + (c.role || "")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  // ---- Render ----
  function makeCard(c) {
    const card = document.createElement("article");
    card.className = "card" + (isFresh(c.last_tweet_at) ? " fresh" : "") + (c.dream_customer ? "" : " not-dream");
    card.draggable = true;
    card.dataset.id = c.id;

    const score = scoreOf(c.id);
    const chips = [];
    if (c.segment) chips.push('<span class="chip seg-' + c.segment + '" title="Segment ' + c.segment + ' — ' + (SEGMENT_LABEL[c.segment] || "") + '">' + c.segment + '</span>');
    if (c.confidence) chips.push('<span class="chip conf-' + c.confidence + '" title="Identification confidence">' + c.confidence + '</span>');
    if (c.dream_customer) chips.push('<span class="chip dream" title="Dream customer">★</span>');

    let signalHtml = "";
    if (c.last_tweet_text) {
      const rt = relTime(c.last_tweet_at);
      signalHtml =
        '<div class="signal">' +
          '<span class="when ' + (isFresh(c.last_tweet_at) ? '' : 'cool') + '">' + (rt || "—") + '</span>' +
          '<div class="tweet">' + escapeHtml(c.last_tweet_text) + '</div>' +
        '</div>';
    }

    card.innerHTML =
      '<div class="name">' + escapeHtml(c.display_name || "—") + '</div>' +
      '<div class="handle"><a href="https://twitter.com/' + encodeURIComponent(c.x_handle) + '" target="_blank" rel="noopener">@' + escapeHtml(c.x_handle) + '</a></div>' +
      (c.firm || c.role ? '<div class="firm">' + escapeHtml([c.firm, c.role].filter(Boolean).join(" · ")) + '</div>' : "") +
      '<div class="bottom">' +
        '<div class="chips">' + chips.join("") + '</div>' +
        '<span class="score ' + (score > 0 ? "has" : "") + '" title="Engagement score (sum of weighted events)">★ ' + score + '</span>' +
      '</div>' +
      signalHtml;

    card.addEventListener("click", (e) => { if (!e.target.closest("a")) openDrawer(c.id); });
    card.addEventListener("dragstart", (e) => {
      card.classList.add("dragging");
      e.dataTransfer.setData("text/contact-id", c.id);
      e.dataTransfer.effectAllowed = "move";
    });
    card.addEventListener("dragend", () => card.classList.remove("dragging"));
    return card;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }

  function attachDropTargets(col) {
    col.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      col.classList.add("drag-over");
    });
    col.addEventListener("dragleave", () => col.classList.remove("drag-over"));
    col.addEventListener("drop", async (e) => {
      e.preventDefault();
      col.classList.remove("drag-over");
      const id = e.dataTransfer.getData("text/contact-id");
      const newStage = col.dataset.stage;
      const c = CONTACTS.find((x) => x.id === id);
      if (!c || c.stage === newStage) return;
      const prevStage = c.stage;
      c.stage = newStage;
      render();
      try {
        await patchContact(id, { stage: newStage });
        toast("→ " + newStage);
      } catch (err) {
        c.stage = prevStage;
        render();
        toast("save failed: " + err.message, true);
      }
    });
  }

  // Dispatcher — renders whichever view is active.
  function render() {
    updateMeta();
    if (VIEW === "leaderboard") renderLeaderboard();
    else renderBoard();
  }

  function updateMeta() {
    const visible = CONTACTS.filter(passesFilter);
    document.getElementById("meta").innerHTML =
      visible.length + " / " + CONTACTS.length + " contacts · " +
      "token: " + (window.PB_CONFIG.generated_at || "—");
  }

  function renderBoard() {
    const visible = CONTACTS.filter(passesFilter);
    const board = document.getElementById("board");
    board.innerHTML = "";
    const byStage = Object.fromEntries(STAGES.map((s) => [s.key, []]));
    for (const c of visible) {
      const stage = byStage[c.stage] ? c.stage : "sourced";
      byStage[stage].push(c);
    }
    for (const s of STAGES) {
      const col = document.createElement("section");
      col.className = "col";
      col.dataset.stage = s.key;
      const cards = byStage[s.key];
      col.innerHTML =
        '<h2>' + s.label + ' <span class="count">' + cards.length + '</span></h2>' +
        '<div class="cards"></div>';
      const cardsEl = col.querySelector(".cards");
      if (cards.length === 0) {
        cardsEl.innerHTML = '<div class="empty">drop here</div>';
      } else {
        for (const c of cards) cardsEl.appendChild(makeCard(c));
      }
      attachDropTargets(col);
      board.appendChild(col);
    }
  }

  // ---- Gamified leaderboard ----
  function tierOf(score) {
    for (const t of TIERS) if (score >= t.min) return t;
    return TIERS[TIERS.length - 1];
  }
  function tierProgress(score) {
    const i = TIERS.findIndex((t) => score >= t.min);
    const cur = TIERS[i], nxt = TIERS[i - 1]; // i-1 is the next-higher tier (list is desc)
    const color = cur.color;
    if (!nxt) return { pct: 100, max: true, color };
    const span = nxt.min - cur.min, into = score - cur.min;
    return { pct: Math.max(5, Math.min(100, Math.round((into / span) * 100))), need: nxt.min - score, nextName: nxt.name, color };
  }
  function typeCounts(cid) {
    const ev = EVENTS_BY_CONTACT[cid] || [];
    const c = { reply: 0, like: 0, repost: 0, quote: 0 };
    for (const e of ev) if (e.type in c) c[e.type]++;
    return c;
  }
  function avatarHue(s) {
    let h = 0;
    for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return h % 360;
  }
  function initial(c) {
    return escapeHtml(String(c.display_name || c.x_handle || "?").trim().slice(0, 1).toUpperCase());
  }
  function bdSpans(bd) {
    const reposts = bd.repost + bd.quote;
    return (
      '<span class="' + (bd.reply ? "" : "z") + '" title="replies">💬 ' + bd.reply + "</span>" +
      '<span class="' + (bd.like ? "" : "z") + '" title="likes">❤️ ' + bd.like + "</span>" +
      '<span class="' + (reposts ? "" : "z") + '" title="reposts + quotes">🔁 ' + reposts + "</span>"
    );
  }
  function badgesFor(cid, rank, score) {
    const c = typeCounts(cid), out = [];
    if (rank === 1 && score > 0) out.push(["🥇", "Top Fan — #1 this period"]);
    if (c.reply >= 5) out.push(["🗣️", "Conversationalist — " + c.reply + " replies"]);
    if (c.repost + c.quote >= 1) out.push(["🔁", "Amplifier — " + (c.repost + c.quote) + " reposts"]);
    if (c.reply && c.like && (c.repost || c.quote)) out.push(["🌈", "Triple Threat — replies, likes & reposts"]);
    return out;
  }

  function lbPool() {
    let pool = CONTACTS.slice();
    if (lbFollowersOnly) pool = pool.filter((c) => c.stage === "followers");
    if (filters.q) {
      const q = filters.q.toLowerCase();
      pool = pool.filter((c) => (c.x_handle + " " + (c.display_name || "") + " " + (c.firm || "")).toLowerCase().includes(q));
    }
    pool.sort((a, b) => scoreOf(b.id) - scoreOf(a.id) || String(a.display_name || a.x_handle).localeCompare(String(b.display_name || b.x_handle)));
    return pool;
  }

  function statCard(v, l, small) {
    return '<div class="lb-stat"><div class="v"' + (small ? ' style="font-size:14px"' : "") + ">" + escapeHtml(String(v)) + '</div><div class="l">' + escapeHtml(l) + "</div></div>";
  }

  function podiumCard(c, rank) {
    const medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : "🥉";
    const has = c && scoreOf(c.id) > 0;
    if (!has) {
      return (
        '<div class="pod rank' + rank + '">' +
        '<div class="medal" style="opacity:.35">' + medal + "</div>" +
        '<div class="avatar" style="background:#1e293b;color:#475569">?</div>' +
        '<div class="pname" style="color:#475569">open slot</div>' +
        '<div class="phandle" style="color:#334155">up for grabs</div>' +
        '<div class="pscore" style="color:#334155">★ 0</div></div>'
      );
    }
    const score = scoreOf(c.id), t = tierOf(score), hue = avatarHue(c.x_handle);
    return (
      '<div class="pod rank' + rank + '" data-id="' + c.id + '">' +
      '<div class="medal">' + medal + "</div>" +
      '<div class="avatar" style="background:hsl(' + hue + ',55%,62%)">' + initial(c) + "</div>" +
      '<div class="pname">' + escapeHtml(c.display_name || c.x_handle) + "</div>" +
      '<div class="phandle">@' + escapeHtml(c.x_handle) + "</div>" +
      '<div class="tier" style="color:' + t.color + ";background:" + t.bg + ';margin-top:6px">' + t.emoji + " " + t.name + "</div>" +
      '<div class="pscore" style="color:' + t.color + '">★ ' + score + "</div>" +
      '<div class="bd" style="justify-content:center;margin-top:5px">' + bdSpans(typeCounts(c.id)) + "</div>" +
      "</div>"
    );
  }

  function lbRow(c, rank) {
    const score = scoreOf(c.id), t = tierOf(score), prog = tierProgress(score), hue = avatarHue(c.x_handle);
    const badges = badgesFor(c.id, rank, score).map((b) => '<span class="badge" title="' + escapeHtml(b[1]) + '">' + b[0] + "</span>").join("");
    return (
      '<div class="lb-row" data-id="' + c.id + '">' +
      '<div class="rank">' + rank + "</div>" +
      '<div class="avatar" style="background:hsl(' + hue + ',55%,62%)">' + initial(c) + "</div>" +
      '<div class="who">' +
        '<div class="nm">' + escapeHtml(c.display_name || c.x_handle) +
          ' <span class="tier" style="color:' + t.color + ";background:" + t.bg + '">' + t.emoji + " " + t.name + "</span></div>" +
        '<div class="hd"><a href="https://twitter.com/' + encodeURIComponent(c.x_handle) + '" target="_blank" rel="noopener">@' + escapeHtml(c.x_handle) + "</a></div>" +
      "</div>" +
      '<div class="right">' +
        '<div class="topline">' +
          '<span class="badges">' + badges + "</span>" +
          '<span class="bd">' + bdSpans(typeCounts(c.id)) + "</span>" +
          '<span class="pts' + (score ? "" : " zero") + '">★ ' + score + "</span>" +
        "</div>" +
        '<div class="xp" title="' + (prog.max ? "Max tier reached" : "+" + prog.need + " to " + prog.nextName) + '"><i style="width:' + prog.pct + "%;background:" + t.color + '"></i></div>' +
      "</div>" +
      "</div>"
    );
  }

  function renderLeaderboard() {
    const el = document.getElementById("leaderboard");
    const pool = lbPool();
    const totalPts = pool.reduce((s, c) => s + scoreOf(c.id), 0);
    const interactions = pool.reduce((s, c) => s + (EVENTS_BY_CONTACT[c.id] || []).length, 0);
    const engaged = pool.filter((c) => scoreOf(c.id) > 0).length;
    const top = pool[0] && scoreOf(pool[0].id) > 0 ? pool[0] : null;

    let html = '<div class="lb-stats">' +
      statCard(totalPts, "community points") +
      statCard(interactions, "interactions") +
      statCard(engaged + " / " + pool.length, "engaged" + (lbFollowersOnly ? " followers" : "")) +
      statCard(top ? "@" + top.x_handle : "—", "top fan", true) +
      "</div>";

    html += '<div class="podium">';
    for (const slot of [1, 0, 2]) html += podiumCard(pool[slot], slot + 1); // visual order: 2nd · 1st · 3rd
    html += "</div>";

    html += '<div class="lb-list">';
    if (pool.length <= 3) {
      html += '<div class="empty" style="padding:14px;text-align:center;color:#475569;font-size:12px">More climbers show up here as the leaderboard fills in.</div>';
    }
    for (let i = 3; i < pool.length; i++) html += lbRow(pool[i], i + 1);
    html += "</div>";

    el.innerHTML = html;
    el.querySelectorAll("[data-id]").forEach((node) => {
      node.addEventListener("click", (e) => { if (!e.target.closest("a")) openDrawer(node.dataset.id); });
    });
  }

  function switchView(v) {
    VIEW = v;
    document.getElementById("view-lb").classList.toggle("active", v === "leaderboard");
    document.getElementById("view-board").classList.toggle("active", v === "board");
    document.getElementById("board").style.display = v === "board" ? "flex" : "none";
    document.getElementById("leaderboard").style.display = v === "leaderboard" ? "block" : "none";
    document.getElementById("board-controls").style.display = v === "board" ? "inline-flex" : "none";
    document.getElementById("lb-controls").style.display = v === "leaderboard" ? "inline-flex" : "none";
    render();
  }

  // ---- Drawer ----
  function openDrawer(id) {
    activeContactId = id;
    const c = CONTACTS.find((x) => x.id === id);
    if (!c) return;
    const sb = scoreBreakdown(id);
    const breakdownLines = Object.entries(sb.breakdown).map(([k, v]) => k + ": " + v.count + " × → " + v.weight).join("<br>") || "(no events yet — populated by v2 scraper)";

    document.getElementById("drawer-body").innerHTML =
      '<label>Handle<input value="@' + escapeHtml(c.x_handle) + '" disabled></label>' +
      '<label>Name<input id="d-name" value="' + escapeHtml(c.display_name || "") + '"></label>' +
      '<div class="row">' +
        '<label>Firm<input id="d-firm" value="' + escapeHtml(c.firm || "") + '"></label>' +
        '<label>Role<input id="d-role" value="' + escapeHtml(c.role || "") + '"></label>' +
      '</div>' +
      '<div class="row">' +
        '<label>Segment<select id="d-segment">' +
          '<option value="">(none)</option>' +
          ["A","B","C","D","E","F"].map((s) => '<option value="' + s + '"' + (c.segment === s ? " selected" : "") + '>' + s + ' · ' + (SEGMENT_LABEL[s] || "") + '</option>').join("") +
        '</select></label>' +
        '<label>Stage<select id="d-stage">' +
          STAGES.map((s) => '<option value="' + s.key + '"' + (c.stage === s.key ? " selected" : "") + '>' + s.label + '</option>').join("") +
        '</select></label>' +
      '</div>' +
      '<label><input type="checkbox" id="d-dream" ' + (c.dream_customer ? "checked" : "") + ' style="width:auto;margin-right:6px;vertical-align:middle"> Dream customer</label>' +
      '<label>Notes<textarea id="d-notes" placeholder="anything worth remembering">' + escapeHtml(c.notes || "") + '</textarea></label>' +
      '<label>Score breakdown<div class="score-breakdown"><span class="total">total: ★ ' + sb.total + '</span><br>' + breakdownLines + '</div></label>' +
      '<div class="actions">' +
        '<button class="secondary" id="d-cancel">Cancel</button>' +
        '<button id="d-save">Save</button>' +
      '</div>';
    document.getElementById("drawer").classList.add("open");
    document.getElementById("mask").classList.add("open");

    document.getElementById("d-cancel").onclick = closeDrawer;
    document.getElementById("d-save").onclick = saveDrawer;
  }

  function closeDrawer() {
    document.getElementById("drawer").classList.remove("open");
    document.getElementById("mask").classList.remove("open");
    activeContactId = null;
  }

  async function saveDrawer() {
    if (!activeContactId) return;
    const c = CONTACTS.find((x) => x.id === activeContactId);
    if (!c) return;
    const body = {
      display_name: document.getElementById("d-name").value.trim(),
      firm:         document.getElementById("d-firm").value.trim(),
      role:         document.getElementById("d-role").value.trim(),
      segment:      document.getElementById("d-segment").value || "",
      stage:        document.getElementById("d-stage").value,
      dream_customer: document.getElementById("d-dream").checked,
      notes:        document.getElementById("d-notes").value,
    };
    try {
      const updated = await patchContact(c.id, body);
      Object.assign(c, updated);
      closeDrawer();
      render();
      toast("saved");
    } catch (err) {
      toast("save failed: " + err.message, true);
    }
  }

  // ---- Init ----
  async function load() {
    splash.textContent = "Loading contacts from PocketBase…";
    try {
      const [contacts, events] = await Promise.all([fetchAllContacts(), fetchAllEvents()]);
      CONTACTS = contacts;
      EVENTS_BY_CONTACT = {};
      for (const e of events) {
        const cid = e.contact;
        (EVENTS_BY_CONTACT[cid] = EVENTS_BY_CONTACT[cid] || []).push(e);
      }
      splash.style.display = "none";
      document.getElementById("hdr").style.display = "flex";
      switchView(VIEW);
    } catch (err) {
      splash.className = "splash err";
      splash.innerHTML = "Failed to load: " + escapeHtml(err.message) + "<br><br>Re-run <code>python3 launch.py</code> to refresh the token, and make sure PocketBase is running at " + escapeHtml(PB_URL) + ".";
    }
  }

  // Wire up filters
  document.getElementById("q").addEventListener("input", (e) => { filters.q = e.target.value; render(); });
  document.getElementById("seg-filter").addEventListener("change", (e) => { filters.segment = e.target.value; render(); });
  document.getElementById("dream-only").addEventListener("change", (e) => { filters.dreamOnly = e.target.checked; render(); });
  document.getElementById("view-lb").addEventListener("click", () => switchView("leaderboard"));
  document.getElementById("view-board").addEventListener("click", () => switchView("board"));
  document.getElementById("lb-followers-only").addEventListener("change", (e) => { lbFollowersOnly = e.target.checked; render(); });
  document.getElementById("refresh").addEventListener("click", load);
  document.getElementById("close").addEventListener("click", closeDrawer);
  document.getElementById("mask").addEventListener("click", closeDrawer);

  load();
})();
</script>
</body>
</html>
