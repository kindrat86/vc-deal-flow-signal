<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seven Signals Product Hunt Gallery</title>
<style>
  :root{--ink:#f5f7fb;--muted:#9ca9bc;--cyan:#17b6f6;--cyan2:#5bd4ff;--navy:#0a1221;--panel:#101d32;--line:rgba(145,184,221,.16)}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--navy);font-family:"Avenir Next","SF Pro Display",sans-serif;color:var(--ink)}
  body:before{content:"";position:fixed;inset:0;background:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;opacity:.20;mask-image:linear-gradient(90deg,#000,transparent 68%)}
  .frame{position:relative;width:100vw;height:100vh;padding:54px 62px 48px;display:flex;flex-direction:column;background:radial-gradient(circle at 82% 12%,rgba(23,182,246,.17),transparent 34%),linear-gradient(135deg,#0a1221 0%,#0c1728 58%,#0b2034 100%)}
  .top{display:flex;justify-content:space-between;align-items:center}
  .brand{font-size:17px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.brand span{color:var(--cyan)}
  .edition{font-size:13px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
  .hero{display:grid;grid-template-columns:1.4fr .8fr;gap:74px;align-items:center;flex:1}
  h1{font-size:66px;line-height:1.04;letter-spacing:-.045em;margin:0;max-width:820px;font-weight:700}
  h2{font-size:54px;line-height:1.05;letter-spacing:-.035em;margin:0 0 18px;font-weight:700}
  .accent{color:var(--cyan2)}
  .sub{font-size:24px;line-height:1.45;color:#c0c9d7;max-width:790px;margin-top:25px}
  .chips{display:flex;gap:11px;flex-wrap:wrap;margin-top:30px}.chip{font-size:13px;letter-spacing:.04em;border:1px solid rgba(91,212,255,.24);background:rgba(23,182,246,.08);padding:9px 13px;border-radius:999px;color:#d7f4ff}
  .book-shell{justify-self:end;width:333px;height:450px;border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:8px;background:rgba(255,255,255,.05);box-shadow:0 34px 80px rgba(0,0,0,.38);transform:perspective(900px) rotateY(-8deg) rotateX(2deg)}
  .book{height:100%;border-radius:17px;background:linear-gradient(155deg,#0f243b 0%,#0d1728 62%,#102b42 100%);padding:30px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
  .book:after{content:"";position:absolute;width:250px;height:250px;border:1px solid rgba(91,212,255,.20);border-radius:50%;right:-110px;bottom:-75px;box-shadow:0 0 0 36px rgba(91,212,255,.035),0 0 0 72px rgba(91,212,255,.02)}
  .seven{font-size:118px;line-height:.8;font-weight:600;color:var(--cyan);letter-spacing:-.08em}.book-title{font-size:28px;line-height:1.08;font-weight:700;letter-spacing:-.03em}.book-meta{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
  .footer{display:flex;justify-content:space-between;align-items:flex-end;font-size:14px;color:var(--muted)}.url{color:#c6efff}
  .proof{display:grid;grid-template-columns:1fr 1.35fr;gap:78px;align-items:center;flex:1}.kicker{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:700;margin-bottom:17px}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:18px}.metric{border:1px solid rgba(255,255,255,.10);background:rgba(11,28,47,.76);border-radius:24px;padding:27px 27px 24px;min-height:156px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}.metric strong{display:block;font-size:52px;color:var(--cyan2);line-height:1}.metric span{display:block;font-size:16px;color:#d2dae6;margin-top:14px}.metric small{display:block;font-size:12px;color:var(--muted);margin-top:7px}
  .trust{display:flex;gap:13px;margin-top:29px}.trust span{border-left:2px solid var(--cyan);padding:3px 0 3px 13px;color:#c7d0dc;font-size:15px}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:stretch;flex:1;margin-top:42px}.step{position:relative;border:1px solid rgba(255,255,255,.10);border-radius:26px;background:rgba(10,27,46,.78);padding:29px 27px;display:flex;flex-direction:column;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}.step-num{width:39px;height:39px;border:1px solid rgba(91,212,255,.30);border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--cyan2);font-weight:700;margin-bottom:32px}.step h3{font-size:28px;letter-spacing:-.025em;margin:0 0 13px}.step p{font-size:17px;line-height:1.48;color:#aeb9c9;margin:0}.command{margin-top:auto;background:#08111e;border:1px solid rgba(91,212,255,.16);border-radius:13px;padding:14px 15px;color:#d5f5ff;font-family:"SF Mono",monospace;font-size:13px}.arrow{position:absolute;right:-22px;top:50%;width:42px;height:42px;border-radius:50%;border:1px solid rgba(91,212,255,.22);background:#0b1e32;display:flex;align-items:center;justify-content:center;color:var(--cyan);z-index:2;font-size:21px}
  .thumb{position:relative;width:100vw;height:100vh;background:linear-gradient(145deg,#0a1221,#0b2035);display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb:before,.thumb:after{content:"";position:absolute;border:1px solid rgba(91,212,255,.15);border-radius:50%}.thumb:before{width:390px;height:390px}.thumb:after{width:280px;height:280px}.thumb-seven{font-size:278px;line-height:.8;font-weight:600;letter-spacing:-.09em;color:var(--cyan);z-index:1;text-shadow:0 28px 70px rgba(23,182,246,.22)}.thumb-label{position:absolute;bottom:46px;font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:#c7d2e0;z-index:2}
</style>
</head>
<body><main id="app"></main>
<script>
const slide=new URLSearchParams(location.search).get('slide')||'1';
const app=document.getElementById('app');
const topBar=`<div class="top"><div class="brand"><span>Git</span>DealFlow</div><div class="edition">Open research · 2026 edition</div></div>`;
if(slide==='thumb') app.innerHTML=`<section class="thumb"><div class="thumb-seven">7</div><div class="thumb-label">Seven Signals</div></section>`;
if(slide==='1') app.innerHTML=`<section class="frame">${topBar}<div class="hero"><div><div class="kicker">Free 104-page field manual</div><h1>The 7 GitHub Signals That Predict <span class="accent">Series A Rounds</span></h1><p class="sub">Read it online. Download PDF or EPUB. Reproduce the method against open data.</p><div class="chips"><span class="chip">No email wall</span><span class="chip">CC BY 4.0</span><span class="chip">Free PDF + EPUB</span></div></div><div class="book-shell"><div class="book"><div class="seven">7</div><div class="book-title">GitHub signals before startup funding</div><div class="book-meta">The Data Nerd · GitDealFlow</div></div></div></div><div class="footer"><span class="url">signals.gitdealflow.com/book</span><span>01 / 03</span></div></section>`;
if(slide==='2') app.innerHTML=`<section class="frame">${topBar}<div class="proof"><div><div class="kicker">Open enough to audit</div><h2>A method you can challenge, not a black box.</h2><p class="sub">The book sits on a public research panel, published methodology, and a dataset anyone can reuse.</p><div class="trust"><span>SSRN methodology</span><span>Zenodo DOI</span><span>CC BY 4.0</span></div></div><div class="metrics"><div class="metric"><strong>55</strong><span>venture-backed startups</span><small>consistent longitudinal panel</small></div><div class="metric"><strong>5</strong><span>quarters observed</span><small>Q2 2025 through Q2 2026</small></div><div class="metric"><strong>219</strong><span>startup-period observations</span><small>structured for replication</small></div><div class="metric"><strong>7</strong><span>operational signals</span><small>plus a 90-minute workflow</small></div></div></div><div class="footer"><span class="url">Dataset DOI 10.5281/zenodo.19650920</span><span>02 / 03</span></div></section>`;
if(slide==='3') app.innerHTML=`<section class="frame">${topBar}<div><div class="kicker" style="margin-top:52px">One open research stack</div><h2>Read it. Reproduce it. Query it.</h2></div><div class="steps"><article class="step"><div class="step-num">01</div><h3>Read</h3><p>Free web edition, PDF, EPUB, Markdown, and plain text. Start with the seven signal chapters.</p><div class="command">signals.gitdealflow.com/book</div><div class="arrow">›</div></article><article class="step"><div class="step-num">02</div><h3>Reproduce</h3><p>Use the open panel and the 90-minute appendix. Keep the misses beside the hits.</p><div class="command">zenodo.org/records/19650920</div><div class="arrow">›</div></article><article class="step"><div class="step-num">03</div><h3>Query</h3><p>Ask Claude or Cursor which technical startups are accelerating this week.</p><div class="command">npx -y @gitdealflow/mcp-signal</div></article></div><div class="footer"><span class="url">Free book · Open data · Free MCP</span><span>03 / 03</span></div></section>`;
</script></body></html>
